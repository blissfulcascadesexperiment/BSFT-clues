<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSFT Reframe Guide | Brief Strategic Family Therapy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 40px;
            text-align: center;
        }

        header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 20px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .search-box input {
            padding: 12px 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            min-width: 250px;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-box button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.3s;
        }

        .search-box button:hover {
            background: #764ba2;
        }

        .category-filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }

        .category-btn {
            padding: 10px 18px;
            background: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.3s;
        }

        .category-btn:hover {
            border-color: #667eea;
            background: #f9f7ff;
        }

        .category-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .reframes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .reframe-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.3s;
            border-left: 5px solid #667eea;
        }

        .reframe-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .reframe-card.behavior-control {
            border-left-color: #f093fb;
        }

        .reframe-card.disengagement {
            border-left-color: #4facfe;
        }

        .reframe-card.enmeshment {
            border-left-color: #43e97b;
        }

        .reframe-card.sermonizing {
            border-left-color: #fa709a;
        }

        .reframe-card.conflict-escalation {
            border-left-color: #fee140;
        }

        .reframe-card.blame-focus {
            border-left-color: #30b0fe;
        }

        .reframe-card.couples-dynamics {
            border-left-color: #ff6b9d;
        }

        .reframe-card.ineffective-parenting {
            border-left-color: #ffa502;
        }

        .category-tag {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .category-tag.behavior-control {
            background: #f093fb;
            color: white;
        }

        .category-tag.disengagement {
            background: #4facfe;
            color: white;
        }

        .category-tag.enmeshment {
            background: #43e97b;
            color: white;
        }

        .category-tag.sermonizing {
            background: #fa709a;
            color: white;
        }

        .category-tag.conflict-escalation {
            background: #fee140;
            color: #333;
        }

        .category-tag.blame-focus {
            background: #30b0fe;
            color: white;
        }

        .category-tag.couples-dynamics {
            background: #ff6b9d;
            color: white;
        }

        .category-tag.ineffective-parenting {
            background: #ffa502;
            color: white;
        }

        .reframe-card h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .reframe-pair {
            margin-bottom: 15px;
        }

        .reframe-pair:last-child {
            margin-bottom: 0;
        }

        .from {
            color: #e74c3c;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.95em;
        }

        .from::before {
            content: "❌ From: ";
        }

        .to {
            color: #27ae60;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .to::before {
            content: "✓ To: ";
        }

        .explanation {
            color: #555;
            line-height: 1.6;
            font-size: 0.95em;
            padding-left: 15px;
            border-left: 3px solid #ecf0f1;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .no-results h3 {
            margin-bottom: 10px;
        }

        .print-btn {
            display: block;
            margin: 30px auto;
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.3s;
        }

        .print-btn:hover {
            background: #764ba2;
        }

        footer {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            color: #666;
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .reframes-grid {
                grid-template-columns: 1fr;
            }

            .search-box input {
                min-width: 200px;
            }

            .category-filters {
                gap: 8px;
            }

            .category-btn {
                padding: 8px 14px;
                font-size: 0.85em;
            }
        }

        @media print {
            body {
                background: white;
            }

            .search-box, .category-filters, .print-btn, header {
                display: none;
            }

            .reframe-card {
                page-break-inside: avoid;
                box-shadow: none;
                border: 1px solid #ddd;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>BSFT Reframe Guide</h1>
            <p>Brief Strategic Family Therapy Reframing Resource for Therapists</p>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search reframes...">
                <button onclick="searchReframes()">Search</button>
            </div>
            <div class="category-filters" id="categoryFilters"></div>
        </header>

        <div class="reframes-grid" id="reframesGrid"></div>

        <button class="print-btn" onclick="window.print()">🖨️ Print All Reframes</button>

        <footer>
            <p>BSFT Reframe Guide | A therapeutic resource for Brief Strategic Family Therapy practitioners</p>
        </footer>
    </div>

    <script>
        const reframes = [
            // BEHAVIOR CONTROL
            {
                category: "behavior-control",
                scenario: "Controlling Parent",
                reframes: [
                    {
                        from: "Controlling",
                        to: "Protective and invested",
                        explanation: "The parent's tight grip on rules and monitoring stems from genuine concern about their child's safety and future. Control is misplaced care."
                    },
                    {
                        from: "Overbearing",
                        to: "Ensuring structure",
                        explanation: "What appears overbearing is the parent's attempt to create predictability and safety through clear expectations and boundaries."
                    },
                    {
                        from: "Rigid and inflexible",
                        to: "Consistent and reliable",
                        explanation: "Rigidity can be reframed as steadfast commitment to consistency—a gift of predictability in an unpredictable world."
                    }
                ]
            },
            {
                category: "behavior-control",
                scenario: "Rebellious Teenager",
                reframes: [
                    {
                        from: "Defiant and disrespectful",
                        to: "Asserting autonomy and identity",
                        explanation: "The teenager isn't rejecting the parent; they're exercising their developmental need to establish independence. It's age-appropriate, not pathological."
                    },
                    {
                        from: "Out of control",
                        to: "Testing boundaries to find safety",
                        explanation: "Teenagers push limits to understand where safety ends and danger begins. This exploration is necessary for development."
                    },
                    {
                        from: "Disrespectful",
                        to: "Communicating through behavior",
                        explanation: "When words fail, behavior becomes the message. The teen is telling the parent something important through their resistance."
                    }
                ]
            },
            {
                category: "behavior-control",
                scenario: "Diabetes Patient Continuing to Eat Harmful Food",
                reframes: [
                    {
                        from: "Noncompliant",
                        to: "Making an immediate comfort choice over long-term health",
                        explanation: "The patient's behavior is not a lack of intelligence or commitment; it is a short-term coping response that is currently outweighing their long-term health goals."
                    },
                    {
                        from: "Self-sabotaging",
                        to: "Acting from overwhelm and habit",
                        explanation: "The behavior is better understood as a familiar coping pattern under stress, rather than a deliberate desire to harm herself."
                    },
                    {
                        from: "Choosing death by food",
                        to: "Seeking relief or pleasure in the moment despite known consequences",
                        explanation: "The behavior reflects a moment-to-moment decision shaped by cravings, stress, and reward, not a fully conscious plan to die."
                    }
                ]
            },

            // DISENGAGEMENT
            {
                category: "disengagement",
                scenario: "Disengaged Parent in High-Conflict Relationship",
                reframes: [
                    {
                        from: "Checked out",
                        to: "Self-protecting a tender spot",
                        explanation: "A disengaged parent isn't absent because they don't care; they've learned that proximity escalates conflict, so they withdraw to keep the peace. The care is present, but the strategy is protective."
                    },
                    {
                        from: "Avoiding",
                        to: "Strategically preserving",
                        explanation: "Avoidance looks like disengagement, but it can also be a disciplined choice to not fuel cycles that hurt the kids. The parent may be choosing when and how to engage."
                    },
                    {
                        from: "Emotionally absent",
                        to: "Exhausted by emotional labor",
                        explanation: "High-conflict relationships drain the parent's capacity to be emotionally available. Their low battery isn't disinterest; it's depletion from managing volatility."
                    },
                    {
                        from: "Not showing up",
                        to: "Showing up in safer ways",
                        explanation: "The disengaged parent may be present in subtler forms: maintaining routines, providing quiet consistency, staying physically safe so they can parent another day."
                    },
                    {
                        from: "Checked out parent",
                        to: "Regulated parent",
                        explanation: "Their disengagement might be the most mature response: not absorbing chaos, so they don't hand it to the children."
                    }
                ]
            },
            {
                category: "disengagement",
                scenario: "Withdrawn or Isolated Teen",
                reframes: [
                    {
                        from: "Antisocial and withdrawn",
                        to: "Introspective and selective",
                        explanation: "Withdrawal isn't social dysfunction; it's the teen's way of processing complex emotions and maintaining emotional safety."
                    },
                    {
                        from: "Isolating themselves",
                        to: "Creating necessary space for self-discovery",
                        explanation: "Time alone is often when teenagers work through identity questions and develop their internal compass."
                    },
                    {
                        from: "Avoiding family",
                        to: "Boundary-setting",
                        explanation: "The teen may be drawing lines to differentiate themselves from family patterns—a necessary step toward individuation."
                    }
                ]
            },

            // ENMESHMENT
            {
                category: "enmeshment",
                scenario: "Enmeshed Parent-Child Relationship",
                reframes: [
                    {
                        from: "Too close and codependent",
                        to: "Intensely connected",
                        explanation: "The closeness, while undifferentiated, comes from a place of deep emotional bonding. The issue isn't the connection; it's the lack of boundaries within it."
                    },
                    {
                        from: "Parent treating child as therapist",
                        to: "Parent seeking emotional support from the only person they trust",
                        explanation: "The parent isn't manipulative; they're isolated and have found their only confidant in their child. Shame about this helps no one."
                    },
                    {
                        from: "Child's identity consumed by family",
                        to: "Child is loyal and family-focused",
                        explanation: "The child's enmeshment reflects loyalty and deep family investment, even if the boundaries are unhealthy."
                    },
                    {
                        from: "Unhealthy dependence",
                        to: "Adaptive to current family system",
                        explanation: "The enmeshment works within the system's current needs, even if it prevents growth. It's not bad; it's just limited."
                    }
                ]
            },
            {
                category: "enmeshment",
                scenario: "Family Funding an Adult Child's Addiction",
                reframes: [
                    {
                        from: "Enabling",
                        to: "Trying to protect the relationship while managing fear",
                        explanation: "The family may be giving money not because they endorse the addiction, but because they are trying to reduce panic, maintain contact, or hold onto hope."
                    },
                    {
                        from: "Codependent",
                        to: "Acting from anxiety and love",
                        explanation: "What looks like codependency can also be a desperate attempt to prevent a loved one from slipping further into harm while feeling helpless."
                    },
                    {
                        from: "Rewarding addiction",
                        to: "Offering help without a clear boundary",
                        explanation: "The money may be an expression of care, but without a structure or accountability plan it can unintentionally reinforce the addictive cycle."
                    }
                ]
            },
            {
                category: "enmeshment",
                scenario: "Family Making Excuses for Harmful Behavior",
                reframes: [
                    {
                        from: "Excusing and enabling",
                        to: "Trying to soften the impact of fear and shame",
                        explanation: "The family may be making excuses to reduce discomfort, protect the person, and avoid the pain of consequences."
                    },
                    {
                        from: "In denial",
                        to: "Avoiding a painful truth they don't yet know how to face",
                        explanation: "The family is not necessarily acting from malice; they are trying to hold onto hope while the reality of the behavior remains frightening."
                    },
                    {
                        from: "Lack of accountability",
                        to: "Unclear boundaries in the face of fear",
                        explanation: "The family may be saying they want change while still protecting the system from the discomfort of firm consequences."
                    }
                ]
            },

            // CONFLICT ESCALATION
            {
                category: "conflict-escalation",
                scenario: "Couple Constantly Fighting",
                reframes: [
                    {
                        from: "A broken relationship",
                        to: "A relationship stuck in a high-intensity cycle",
                        explanation: "The constant fighting may reflect a pattern of escalating conflict rather than an absence of love or commitment."
                    },
                    {
                        from: "Incompatible",
                        to: "Two people in emotional dysregulation with unresolved attachment needs",
                        explanation: "The fight can be reframed as a sign that both people are overwhelmed by the intensity of the relationship, not necessarily that they are fundamentally mismatched."
                    },
                    {
                        from: "Unwise to marry",
                        to: "Needing structure, repair, and clarity before commitment",
                        explanation: "The decision to marry may be driven by hope and attachment rather than resolution, making the need for intervention clear rather than the couple inherently doomed."
                    }
                ]
            },
            {
                category: "conflict-escalation",
                scenario: "Partner Lashing Out After Respect Has Returned",
                reframes: [
                    {
                        from: "Explosive and irrational",
                        to: "Feeling destabilized by the loss of familiar conflict",
                        explanation: "The person's reaction may reflect anxiety when the pattern shifts and old ways of relating are no longer available."
                    },
                    {
                        from: "Provoking chaos",
                        to: "Trying to restore a familiar emotional pattern",
                        explanation: "When the relationship becomes more peaceful, some people respond with escalation because the old cycle is the only context that feels predictable."
                    },
                    {
                        from: "Disrespectful and unsafe",
                        to: "Defensively reacting to perceived threat",
                        explanation: "The outburst may represent an attempt to regain control in a system that has changed, rather than a simple disregard for the relationship."
                    }
                ]
            },

            // INEFFECTIVE PARENTING
            {
                category: "ineffective-parenting",
                scenario: "Parent and Child Excusing the Child's Behavior While Wanting It Gone",
                reframes: [
                    {
                        from: "Parent is inconsistent and passive",
                        to: "Parent is trying to protect the child and their own anxiety at the same time",
                        explanation: "The parent may want the behavior to stop, but their fear of consequences and their wish to avoid conflict keep them from enforcing structure."
                    },
                    {
                        from: "Child is manipulative",
                        to: "Child is learning that behavior gets relief without accountability",
                        explanation: "The child may not be intentionally manipulative; they may simply be learning that the family responds with excuses rather than boundaries."
                    },
                    {
                        from: "The family is hypocritical",
                        to: "The family is stuck in a wishful but unstable system",
                        explanation: "The mixed message—wanting the behavior gone while creating loopholes—can be reframed as a family system struggling to handle discomfort without clear limits."
                    }
                ]
            },

            // COUPLES DYNAMICS
            {
                category: "couples-dynamics",
                scenario: "Couple Choosing Marriage While Still Fighting",
                reframes: [
                    {
                        from: "A sign they should not marry",
                        to: "A sign they are in urgent need of repair before commitment",
                        explanation: "The couple may be acting from hope, fear of separation, or attachment needs rather than clarity. The problem is not that they can't love each other, but that they haven't yet built a functional way to handle conflict."
                    },
                    {
                        from: "Emotional incompatibility",
                        to: "A relationship in active escalation",
                        explanation: "The conflict may be more about a painful cycle than a fundamental lack of compatibility. The couple needs a structure that interrupts the pattern, not a verdict about the relationship."
                    },
                    {
                        from: "A doomed match",
                        to: "A couple who needs skills, not a conclusion",
                        explanation: "The relationship is not automatically doomed; it is a system that currently lacks the patterns capable of managing distress without escalating."
                    }
                ]
            },

            // BLAME FOCUS
            {
                category: "blame-focus",
                scenario: "Partner Blaming as Conflict Escalates",
                reframes: [
                    {
                        from: "The other person is the problem",
                        to: "The other person is one part of a disruptive interaction pattern",
                        explanation: "Blame can be a way to stabilize a dysregulated system, even when it is inaccurate. The focus shifts from who is worse to how the cycle is being maintained."
                    },
                    {
                        from: "They are just attacking",
                        to: "They are reacting to threat, shame, or loss of control",
                        explanation: "The accusation may be a protective response to fear, not necessarily a true reflection of the full reality."
                    },
                    {
                        from: "This is all their fault",
                        to: "This is the pattern needing attention",
                        explanation: "When blame takes over, it can conceal the more important question: what interactions are keeping the conflict alive?"
                    }
                ]
            },

            // SERMONIZING
            {
                category: "sermonizing",
                scenario: "Family Offering Advice Instead of Changing the Cycle",
                reframes: [
                    {
                        from: "They are moralizing",
                        to: "They are trying to manage their anxiety through certainty",
                        explanation: "Advice can function as a way to contain fear when people feel helpless in the face of the problem."
                    },
                    {
                        from: "They are lecturing",
                        to: "They are attempting to regain control through expertise",
                        explanation: "The sermonizing may be an effort to restore a sense of order in a family system that feels chaotic."
                    },
                    {
                        from: "They are being preachy",
                        to: "They are trying to protect themselves from helplessness",
                        explanation: "When people cannot influence the system directly, they may shift into advice-giving as a way to feel useful and in charge."
                    }
                ]
            },

            // DISENGAGEMENT (continued)
            {
                category: "disengagement",
                scenario: "Partner Pulling Away During Conflict",
                reframes: [
                    {
                        from: "They are abandoning the relationship",
                        to: "They are reducing the intensity to stay regulated",
                        explanation: "Withdrawal may be a self-protective strategy to prevent the system from intensifying and becoming overwhelming."
                    },
                    {
                        from: "They don't care anymore",
                        to: "They are conserving energy because the cycle is draining",
                        explanation: "Distance can be a way of protecting the person from repeated emotional exhaustion and reactivity."
                    },
                    {
                        from: "They are shutting down",
                        to: "They are setting a boundary against reactivity",
                        explanation: "The shut-down posture may be an adaptive effort to stop the cycle rather than a sign that the relationship is over."
                    }
                ]
            }
        ];

        function renderReframes() {
            const categoryFilters = document.getElementById('categoryFilters');
            const grid = document.getElementById('reframesGrid');
            const uniqueCategories = [...new Set(reframes.map(item => item.category))];

            categoryFilters.innerHTML = '';
            const allBtn = document.createElement('button');
            allBtn.className = 'category-btn active';
            allBtn.textContent = 'All';
            allBtn.onclick = () => {
                document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
                allBtn.classList.add('active');
                renderReframes();
            };
            categoryFilters.appendChild(allBtn);

            uniqueCategories.forEach(category => {
                const btn = document.createElement('button');
                btn.className = 'category-btn';
                btn.textContent = category.replace(/-/g, ' ');
                btn.onclick = () => {
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    filterReframes(category);
                };
                categoryFilters.appendChild(btn);
            });

            renderCards(reframes);
        }

        function filterReframes(category) {
            const filtered = reframes.filter(item => item.category === category);
            renderCards(filtered);
        }

        function renderCards(items) {
            const grid = document.getElementById('reframesGrid');
            grid.innerHTML = '';

            if (!items.length) {
                grid.innerHTML = `
                    <div class="no-results">
                        <h3>No reframes match your search.</h3>
                        <p>Try a different keyword or category.</p>
                    </div>
                `;
                return;
            }

            items.forEach(item => {
                const card = document.createElement('article');
                card.className = `reframe-card ${item.category}`;

                const tag = document.createElement('div');
                tag.className = `category-tag ${item.category}`;
                tag.textContent = item.category.replace(/-/g, ' ');

                const title = document.createElement('h3');
                title.textContent = item.scenario;

                card.appendChild(tag);
                card.appendChild(title);

                item.reframes.forEach(pair => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'reframe-pair';

                    const from = document.createElement('div');
                    from.className = 'from';
                    from.textContent = pair.from;

                    const to = document.createElement('div');
                    to.className = 'to';
                    to.textContent = pair.to;

                    const explanation = document.createElement('div');
                    explanation.className = 'explanation';
                    explanation.textContent = pair.explanation;

                    wrapper.appendChild(from);
                    wrapper.appendChild(to);
                    wrapper.appendChild(explanation);
                    card.appendChild(wrapper);
                });

                grid.appendChild(card);
            });
        }

        function searchReframes() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const activeCategoryBtn = document.querySelector('.category-btn.active');
            const activeCategory = activeCategoryBtn && activeCategoryBtn.textContent.trim() !== 'All' ? activeCategoryBtn.textContent.trim().replace(/ /g, '-') : null;

            let filtered = reframes;
            if (activeCategory) {
                filtered = filtered.filter(item => item.category === activeCategory);
            }

            if (query) {
                filtered = filtered.filter(item => {
                    const text = `${item.scenario} ${item.reframes.map(r => `${r.from} ${r.to} ${r.explanation}`).join(' ')}`.toLowerCase();
                    return text.includes(query);
                });
            }

            renderCards(filtered);
        }

        document.getElementById('searchInput').addEventListener('input', searchReframes);
        renderReframes();
    </script>
</body>
</html>
